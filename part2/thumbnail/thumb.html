<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(Montserrat-Variable.woff2);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;font-family:M,sans-serif;background:#0b1622}
.host{position:absolute;inset:0;background:url(host.jpg) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(11,22,34,.0) 38%,rgba(11,22,34,.88) 62%,rgba(11,22,34,.97) 100%)}
.top{position:absolute;top:90px;left:0;right:0;display:flex;justify-content:center}
.badge{display:flex;border-radius:14px;overflow:hidden;font-weight:800;font-size:30px;letter-spacing:.06em;text-transform:uppercase}
.badge .a{background:#5cb128;color:#0b1622;padding:20px 28px}.badge .b{background:#0b1622;color:#fbfcfa;padding:20px 28px;border:2px solid #5cb128;border-left:none;border-radius:0 14px 14px 0}
.txt{position:absolute;left:70px;right:70px;top:930px}
h1{color:#fbfcfa;font-weight:900;font-size:150px;line-height:1;letter-spacing:-.03em}
h1 .g{color:#5cb128}h1 .n{color:#0092d8}h1 .v{display:block;font-size:64px;color:#a9c2d6;font-weight:800;margin:8px 0}
.sub{margin-top:34px;color:#fbfcfa;font-weight:800;font-size:54px;line-height:1.15}
.sub b{color:#f2b632}
.logo{position:absolute;bottom:200px;left:0;right:0;display:flex;justify-content:center}
.logo img{height:120px;background:#fff;border-radius:16px;padding:10px 24px}
</style></head><body>
<div class="host"></div><div class="shade"></div>
<div class="top"><div class="badge"><div class="a">Part 2</div><div class="b">Best Medigap Plans 2027</div></div></div>
<div class="txt"><h1><span class="g">Plan G</span><span class="v">vs</span><span class="n">Plan N</span></h1>
<div class="sub">The <b>2 differences</b> that decide which fits you</div></div>
<div class="logo"><img src="logo.png"></div>
</body></html>
